name: test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  npm-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node --check Worker.js
      - run: npm test
      - run: npm run check
